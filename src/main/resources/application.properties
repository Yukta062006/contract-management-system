# Spring Application Configuration
spring.application.name=contract-management

# Server Port (supports dynamic cloud PORT assigned by Render, Railway, AWS, etc.)
server.port=${PORT:8080}

# Database Configuration (supports Cloud MySQL or zero-config local/cloud storage)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/contract_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Multipart / File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Local Document Upload Storage Path
file.upload-dir=uploads

# Swagger / OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
